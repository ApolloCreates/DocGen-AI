[project]
name = "docgen-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "gitpython>=3.1.57",
    "groq>=1.6.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.10",
    "networkx>=3.6.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.13.7",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
